spring:
  application:
    name: invite-date
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:invite_date}}
    username: ${PG_USERNAME:admin}
    password: ${PG_PASSWORD:password123}
    hikari:
      pool-name: pool-${spring.application.name}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
