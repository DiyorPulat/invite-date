services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invite_date
      POSTGRES_USER: invite_date
      POSTGRES_PASSWORD: invite_date
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invite_date -d invite_date"]
      interval: 5s
      timeout: 5s
      retries: 10
